<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>שלח ל-Planner</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css">
</head>
<body>
  <main id="app">
    <section id="status" class="status" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span id="statusText">מתחבר…</span>
    </section>

    <section id="signin" class="card hidden">
      <p>צריך להתחבר פעם אחת כדי לגשת לתוכניות ה-Planner שלך.</p>
      <button id="signinBtn" class="primary" type="button">התחברות</button>
    </section>

    <form id="taskForm" class="hidden" novalidate>
      <p id="doneBefore" class="notice hidden">✓ כבר נוצרה משימה מהמייל הזה</p>

      <div id="favRow" class="field hidden">
        <span class="label">מועדפים</span>
        <div id="favChips" class="chips"></div>
      </div>

      <div class="field">
        <label for="planSelect">תוכנית <span id="planCount" class="muted small"></span></label>
        <input id="planFilter" type="search" class="filter" placeholder="חיפוש תוכנית…" autocomplete="off">
        <div class="row">
          <select id="planSelect" required></select>
          <button id="favBtn" class="icon" type="button" title="הוסף/הסר ממועדפים" aria-label="מועדף">☆</button>
        </div>
      </div>

      <div class="field">
        <label for="bucketSelect">מיכל</label>
        <select id="bucketSelect"></select>
        <input id="newBucketInput" type="text" class="after hidden" maxlength="255" placeholder="שם המיכל החדש">
      </div>

      <div class="field">
        <label for="titleInput">כותרת המשימה</label>
        <input id="titleInput" type="text" maxlength="255" required>
      </div>

      <div class="field">
        <label for="assigneeSelect">שיוך</label>
        <select id="assigneeSelect"></select>
        <input id="peopleSearch" type="search" class="filter after" placeholder="חיפוש אדם בארגון (שם או מייל)…" autocomplete="off">
        <div id="peopleResults" class="results hidden" role="listbox"></div>
        <p id="assigneeWarn" class="warn hidden"></p>
      </div>

      <div class="grid2">
        <div class="field">
          <label for="startInput">תאריך התחלה</label>
          <input id="startInput" type="date">
        </div>
        <div class="field">
          <label for="dueInput">תאריך יעד</label>
          <input id="dueInput" type="date">
        </div>
      </div>
      <p id="dateWarn" class="warn hidden">תאריך היעד לפני תאריך ההתחלה.</p>

      <div class="field">
        <label for="prioritySelect">עדיפות</label>
        <select id="prioritySelect">
          <option value="1">🔴 דחוף</option>
          <option value="3">❗ חשוב</option>
          <option value="5" selected>בינוני</option>
          <option value="9">⬇ נמוך</option>
        </select>
      </div>

      <div class="field">
        <span class="label">תוויות</span>
        <div id="labelChips" class="chips"></div>
        <div class="row after">
          <input id="newLabelInput" type="text" maxlength="40" placeholder="תווית חדשה…" autocomplete="off">
          <button id="addLabelBtn" class="icon" type="button" title="צור תווית" aria-label="צור תווית">+</button>
        </div>
        <p id="labelErr" class="warn hidden"></p>
      </div>

      <div class="field">
        <label class="check"><input id="includeBody" type="checkbox" checked> לצרף את תוכן המייל לתיאור</label>
        <textarea id="bodyInput" rows="6" aria-label="תוכן המייל (ניתן לעריכה)"></textarea>
        <p class="muted small">אפשר לערוך או לקצר את תוכן המייל לפני היצירה.</p>
      </div>

      <div class="field">
        <label class="check"><input id="markMail" type="checkbox" checked> לסמן את המייל בקטגוריה ירוקה "משימה ב-Planner"</label>
      </div>

      <button id="createBtn" class="primary big" type="submit">צור משימה</button>
    </form>

    <section id="done" class="card success hidden">
      <p class="big-text">✔ המשימה נוצרה</p>
      <p id="doneDetails" class="muted"></p>
      <p id="doneWarn" class="warn hidden"></p>
      <a id="openTaskLink" class="primary linkbtn" target="_blank" rel="noopener">פתח ב-Planner</a>
      <button id="againBtn" type="button" class="secondary">משימה נוספת מאותו מייל</button>
      <button id="closeBtn" type="button" class="secondary">סגור</button>
    </section>

    <section id="error" class="card error hidden">
      <p id="errorText"></p>
      <button id="retryBtn" type="button" class="secondary">נסה שוב</button>
    </section>

    <footer class="foot" dir="ltr">
      <picture>
        <source srcset="elcom-logo-dark.png" media="(prefers-color-scheme: dark)">
        <img src="elcom-logo.png" width="55" height="32" alt="">
      </picture>
      <span class="brand">Elcom IT</span>
    </footer>
  </main>
  <script src="taskpane.js"></script>
</body>
</html>
